# Compatible « podman compose » et « docker compose ».
# Lancer depuis ce dossier :
#   podman compose --env-file ../.env --profile core up -d
#
# Profils : core (phase 0). Les profils ai, calendar, ui et relay arrivent
# avec les phases correspondantes (voir docs/roadmap.md).

name: darlen

services:
  postgres:
    image: docker.io/pgvector/pgvector:pg18
    profiles: [core]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    profiles: [core]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  migrate:
    build: ../backend
    profiles: [core]
    command: ["python", "-m", "darlen.migrate"]
    environment: &backend-env
      DARLEN_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DARLEN_S3_ENDPOINT: http://garage:3900
      DARLEN_S3_REGION: garage
      DARLEN_S3_BUCKET: ${S3_BUCKET}
      DARLEN_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      DARLEN_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      DARLEN_TIMEZONE: ${DARLEN_TIMEZONE:-Europe/Paris}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    profiles: [core]
    restart: unless-stopped
    command: ["uvicorn", "darlen.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  garage-meta:
  garage-data:
